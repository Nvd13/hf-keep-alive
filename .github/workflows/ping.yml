name: Ping HF Spaces

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep all Spaces alive
        run: |
          URLS=(
            "https://nvd13-tgtobl1.hf.space/"
            "https://nvd13-gittobl1.hf.space/"
            "https://nvd13-tgtobl2.hf.space/"
          )
          for url in "${URLS[@]}"; do
            echo "Pinging $url"
            curl -s -o /dev/null -w "%{http_code}" "$url"
          done
