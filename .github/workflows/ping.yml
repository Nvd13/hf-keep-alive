name: Ping HF Space

on:
  schedule:
    - cron: '*/15 * * * *'   # runs every 15 minutes
  workflow_dispatch:          # allows manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://nvd13-test1.hf.space/
